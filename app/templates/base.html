<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini CRM</title><style>
:root{--bg:#f4f5f7;--side:#111827;--pri:#2563eb;--bd:#e2e8f0;--mut:#64748b}
*{box-sizing:border-box}body{font-family:Inter,system-ui,sans-serif;margin:0;background:var(--bg);color:#1e293b;font-size:14px}
.app{display:flex;min-height:100vh}aside{width:210px;background:var(--side);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
aside h1{color:#fff;font-size:17px;margin:0 8px 18px}aside a{color:#cbd5e1;text-decoration:none;padding:9px 12px;border-radius:8px}
aside a.on,aside a:hover{background:#1f2937;color:#fff}.user{margin-top:auto;color:#94a3b8;padding:8px}.user button{background:#374151;margin-top:6px;width:100%}
main{flex:1;padding:24px;min-width:0;max-width:1200px}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
input,select,textarea,button{padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;background:#fff}
button,.btn{background:var(--pri);color:#fff;border:0;cursor:pointer;text-decoration:none;padding:8px 12px;border-radius:8px;display:inline-block}
button.red{background:#dc2626}button.ghost{background:#fff;color:#334155;border:1px solid #cbd5e1}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #eef2f7;text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:14px}.stat b{font-size:24px;display:block}.stat span{color:var(--mut)}
.ok{color:#15803d}.bad{color:#b45309}small,.mut{color:var(--mut);font-size:12px}
.pill{display:inline-block;background:#eef2ff;color:#3730a3;border-radius:99px;padding:2px 8px;font-size:11px;margin-right:4px}
</style></head><body><div class="app"><aside><h1>&#9670; Mini CRM</h1>
<a href="/" class="{% if request.path == '/' %}on{% endif %}">Contacts</a>
<a href="/workspace/" class="{% if 'workspace' in request.path %}on{% endif %}">AI Workspace</a>
<a href="/calls/" class="{% if 'calls' in request.path %}on{% endif %}">Calls</a>
<div class="user">{{ request.user.username }}<form method="post" action="/logout/">{% csrf_token %}<button>Sign out</button></form></div></aside>
<main>{% block body %}{% endblock %}</main></div>
<script>const CSRF=document.querySelector('[name=csrfmiddlewaretoken]').value;
const post=(u,b)=>fetch(u,{method:'POST',headers:{'X-CSRFToken':CSRF,'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json());</script>
</body></html>
