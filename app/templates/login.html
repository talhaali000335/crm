<!doctype html><html><head><meta charset="utf-8"><title>Sign in</title><style>
body{font-family:system-ui,sans-serif;background:#111827;display:grid;place-items:center;height:100vh;margin:0}
form{background:#fff;padding:28px;border-radius:14px;width:300px;display:flex;flex-direction:column;gap:10px}
input,button{padding:10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}button{background:#2563eb;color:#fff;border:0}</style></head>
<body><form method="post"><h2 style="margin:0">&#9670; Mini CRM</h2>{% csrf_token %}
{% if form.errors %}<small style="color:#dc2626">Wrong username or password.</small>{% endif %}
<input name="username" placeholder="Username" autofocus><input name="password" type="password" placeholder="Password"><button>Sign in</button></form></body></html>
